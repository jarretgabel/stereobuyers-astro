<script>
    // Third-party trackers load on first interaction (or after 4s) so they don't compete with first paint.
    (function(w) {
      var q = [], started = false;
      function run() {
        if (started) return;
        started = true;
        ['scroll', 'pointerdown', 'keydown', 'touchstart', 'mousemove'].forEach(function(e) { w.removeEventListener(e, run); });
        q.forEach(function(fn) { try { fn(); } catch (err) {} });
        q = [];
      }
      var later = [], lateDone = false;
      function runLater() {
        if (lateDone) return;
        lateDone = true;
        later.forEach(function(fn) { try { fn(); } catch (err) {} });
        later = [];
      }
      // Heaviest trackers (PostHog) wait for first interaction or 10s after load.
      w.sbLater = function(fn) {
        if (lateDone) { try { fn(); } catch (err) {} return; }
        later.push(fn);
      };
      w.sbDefer = function(fn, now) {
        if (started || now) { try { fn(); } catch (err) {} return; }
        q.push(fn);
      };
      ['scroll', 'pointerdown', 'keydown', 'touchstart', 'mousemove'].forEach(function(e) { w.addEventListener(e, run, { passive: true, once: true }); });
      w.addEventListener('load', function() { setTimeout(run, 4000); setTimeout(runLater, 10000); });
      ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function(e) { w.addEventListener(e, runLater, { passive: true, once: true }); });
    })(window);
  </script>
  <script>
    // Adobe Fonts serves font-display:auto (invisible text until the fonts arrive). Load the kit CSS ourselves and keep the page hidden until its fonts are ready, so the fallback font never flashes. A timeout reveals the page if Typekit is slow or blocked.
    (function(d) {
      var root = d.documentElement;
      var url = 'https://use.typekit.net/mbi7opk.css';
      var revealed = false;
      var kit = [];
      root.classList.add('fonts-pending');
      var hide = d.createElement('style');
      hide.textContent = 'html.fonts-pending body{visibility:hidden}';
      d.head.appendChild(hide);
      function reveal() { if (revealed) return; revealed = true; root.classList.remove('fonts-pending'); root.classList.add('page-enter'); }
      setTimeout(reveal, 3000);
      function waitForFonts() {
        if (!d.body) return d.addEventListener('DOMContentLoaded', waitForFonts);
        void d.body.offsetHeight; // start loading the faces the page uses
        (d.fonts ? d.fonts.ready : Promise.resolve()).then(reveal, reveal);
      }
      // Astro's view transitions drop head elements the next page doesn't have, so carry the font CSS over to the incoming head.
      d.addEventListener('astro:before-swap', function(e) {
        e.newDocument.documentElement.classList.add('sb-nav');
        // The router scrolls to the top on swap, which would flash the old page's top while it fades out.
        if (window.scrollY > 20) e.newDocument.documentElement.classList.add('sb-cut');
        kit.forEach(function(node) { e.newDocument.head.appendChild(node.cloneNode(true)); });
      });
      function fallback() {
        var l = d.createElement('link');
        l.rel = 'stylesheet';
        l.href = url;
        l.onload = waitForFonts;
        l.onerror = reveal;
        kit.push(l);
        d.head.appendChild(l);
      }
      fetch(url).then(function(r) { return r.text(); }).then(function(css) {
        var st = d.createElement('style');
        st.textContent = css.replace(/font-display:\s*auto/g, 'font-display:swap');
        kit.push(st);
        d.head.appendChild(st);
        waitForFonts();
      }).catch(fallback);
    })(document);
  </script>
