  - divider: true
  - name: site-content
    label: FAQ & press
    files:
      - name: faq
        label: FAQ
        file: src/data/faq.json
        fields:
          - name: sections
            label: Sections
            widget: list
            root: true
            label_singular: section
            summary: "{{fields.title}}"
            fields:
              - name: title
                label: Section title
              - name: id
                label: Anchor ID
                hint: Lowercase, no spaces. Used for the link to this section.
              - name: items
                label: Questions
                widget: list
                label_singular: question
                summary: "{{fields.q}}"
                fields:
                  - name: q
                    label: Question
                  - name: a
                    label: Answer
                    widget: text
      - name: press
        label: Press articles
        file: src/data/press.json
        fields:
          - name: articles
            label: Articles
            widget: list
            label_singular: article
            summary: "{{fields.title}}"
            fields:
              - name: title
                label: Title
              - name: source
                label: Publication
              - name: date
                label: Date
                hint: "For example: March 2022"
              - name: url
                label: Link or PDF
                hint: A web address, or an uploaded PDF such as /assets/media/file.pdf
              - name: type
                label: Logo type
                required: false
                hint: Matches an existing logo name, for example architectural-digest
              - name: body
                label: Excerpt
                required: false
                widget: text
              - name: view
                label: Link text
                required: false
              - name: readmore
                label: Show "read more"
                widget: boolean
                required: false
