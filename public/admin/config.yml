# Generated by scripts/generate-cms-config.mjs - edit the script, not this file.
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: jarretgabel/stereobuyers-astro
  branch: main
  base_url: https://alqyo3typt6m6lyxrjkrq4fb740agdoh.lambda-url.us-east-1.on.aws
publish_mode: editorial_workflow
site_url: https://www.stereobuyers.com
media_folder: public/assets/media
public_folder: /assets/media
output:
  omit_empty_optional_fields: true
collections:
  - name: blog
    label: Blog posts
    label_singular: blog post
    folder: src/content/pages/blog
    create: true
    slug: "{{title}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
      - name: date
        label: Publish date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: YYYY-MM-DD HH:mm
      - name: image
        label: Image
        widget: image
        choose_url: false
      - name: copy
        label: Content
        widget: markdown
      - name: seo_title
        label: Search result title (SEO)
        required: false
      - name: seo_description
        label: Search result description (SEO)
        required: false
        widget: text
      - name: layout
        widget: hidden
        default: blog
      - name: page_class
        widget: hidden
        default: blog
  - name: service-areas
    label: Service areas
    label_singular: service area
    folder: src/content/pages/service-area
    create: true
    slug: "{{area}}"
    filter:
      field: layout
      value: service-area
    fields:
      - name: area
        label: Area
        hint: "For example: Denver, Colorado"
      - name: title
        label: Page title
        hint: "For example: Service Area - Denver, Colorado"
      - name: titleAdd
        label: Title suffix
        required: false
        hint: "For example: in Denver, Colorado"
      - name: image
        label: Image
        widget: image
        choose_url: false
        required: false
      - name: copy
        label: Content
        required: false
        widget: text
      - name: seo_title
        label: Search result title (SEO)
        required: false
      - name: seo_description
        label: Search result description (SEO)
        required: false
        widget: text
      - name: layout
        widget: hidden
        default: service-area
      - name: page_class
        widget: hidden
        default: free-pick-up-in-our-service-area
      - name: description
        widget: hidden
      - name: fb_image
        widget: hidden
      - name: navOrder
        widget: hidden
      - name: navTitle
        widget: hidden
      - name: permalink
        widget: hidden
      - name: tw_image
        widget: hidden
  - name: brand-histories
    label: Brand histories
    label_singular: brand history
    folder: src/content/pages/brand-history
    create: true
    slug: "{{brand}}"
    fields:
      - name: brand
        label: Brand
      - name: history
        label: History
