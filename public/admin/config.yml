# Generated by scripts/generate-cms-config.mjs - edit the script, not this file.
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: jarretgabel/stereobuyers-astro
  branch: main
  base_url: https://alqyo3typt6m6lyxrjkrq4fb740agdoh.lambda-url.us-east-1.on.aws
publish_mode: editorial_workflow
site_url: https://www.stereobuyers.com
media_folder: public/assets/media
public_folder: /assets/media
output:
  omit_empty_optional_fields: true
collections:
  - name: blog
    label: Blog posts
    label_singular: blog post
    folder: src/content/pages/blog
    create: true
    slug: "{{title}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
      - name: date
        label: Publish date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: YYYY-MM-DD HH:mm
      - name: image
        label: Image
        widget: image
        choose_url: false
      - name: copy
        label: Content
        widget: markdown
      - name: seo_title
        label: Search result title (SEO)
        required: false
      - name: seo_description
        label: Search result description (SEO)
        required: false
        widget: text
      - name: layout
        widget: hidden
        default: blog
      - name: page_class
        widget: hidden
        default: blog
  - name: service-areas
    label: Service areas
    label_singular: service area
    folder: src/content/pages/service-area
    create: true
    slug: "{{area}}"
    filter:
      field: layout
      value: service-area
    fields:
      - name: area
        label: Area
        hint: "For example: Denver, Colorado"
      - name: title
        label: Page title
        hint: "For example: Service Area - Denver, Colorado"
      - name: titleAdd
        label: Title suffix
        required: false
        hint: "For example: in Denver, Colorado"
      - name: image
        label: Image
        widget: image
        choose_url: false
        required: false
      - name: copy
        label: Content
        required: false
        widget: text
      - name: seo_title
        label: Search result title (SEO)
        required: false
      - name: seo_description
        label: Search result description (SEO)
        required: false
        widget: text
      - name: layout
        widget: hidden
        default: service-area
      - name: page_class
        widget: hidden
        default: free-pick-up-in-our-service-area
      - name: description
        widget: hidden
      - name: fb_image
        widget: hidden
      - name: permalink
        widget: hidden
      - name: tw_image
        widget: hidden
  - name: brand-histories
    label: Brand histories
    label_singular: brand history
    folder: src/content/pages/brand-history
    create: true
    slug: "{{brand}}"
    fields:
      - name: brand
        label: Brand
      - name: history
        label: History
        widget: markdown
      - name: type
        widget: hidden
        default: history
  - divider: true
  - name: site-settings
    label: Header, footer & hero
    files:
      - name: settings
        label: Header, footer & home hero
        file: src/data/settings.json
        fields:
          - name: phone
            label: Phone number
            hint: "Format: 718-260-8948. Used in the header bar and the footer."
          - name: email
            label: Email address
          - name: nav
            label: Menu links
            widget: list
            label_singular: menu link
            summary: "{{fields.label}}"
            hint: Drag to reorder.
            fields:
              - name: label
                label: Label
              - name: url
                label: Link
                hint: "For example: /about/"
          - name: navCta
            label: Last menu item (quote link)
          - name: stickyIntro
            label: Bar text shown when scrolling
            required: false
            hint: "Optional. For example: Ready to get started? Leave blank to start the bar with the button."
          - name: stickyButton
            label: Bar button text
          - name: footer
            label: Footer
            widget: object
            fields:
              - name: links
                label: Footer links
                widget: list
                label_singular: link
                summary: "{{fields.label}}"
                fields:
                  - name: label
                    label: Label
                  - name: url
                    label: Link
              - name: copyright
                label: Copyright text
                hint: The year is added automatically.
          - name: hero
            label: Home page hero
            widget: object
            fields:
              - name: lines
                label: Headline lines
                widget: list
                field:
                  name: line
                  label: Line
                hint: Each line is shown on its own row.
              - name: copy
                label: Paragraph
                widget: text
                hint: "Links: [link text](/service-area)"
              - name: featuredLabel
                label: Label above the press logo
              - name: button
                label: Button text
